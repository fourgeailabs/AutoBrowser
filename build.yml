name: Build and Release APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Prepare Keystore
        run: |
          # Ensure keystore consistency across builds
          if [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > my-upload-key.jks
            echo "KEYSTORE_PATH=$GITHUB_WORKSPACE/my-upload-key.jks" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No custom release keystore secret found. Ensuring consistent debug keystore..."
            if [ ! -f "debug.keystore" ]; then
              keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=FourgeAILabs, OU=Dev, O=FourgeAI, L=SanFrancisco, S=CA, C=US"
            fi
          fi

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          fi

      - name: Build APK with Gradle
        run: |
          if [ -f "gradlew" ]; then
            ./gradlew assembleDebug --stacktrace
          else
            gradle assembleDebug --stacktrace
          fi

      - name: Find and Rename APK
        id: find_apk
        run: |
          APK_PATH=$(find app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: No APK found!"
            exit 1
          fi
          echo "Found APK at: $APK_PATH"
          mkdir -p release_apk
          cp "$APK_PATH" release_apk/AutoBrowser-v2.03.00.apk
          echo "apk_path=release_apk/AutoBrowser-v2.03.00.apk" >> $GITHUB_OUTPUT

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AutoBrowser-APK
          path: ${{ steps.find_apk.outputs.apk_path }}

      - name: Create Release and Upload APK
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find_apk.outputs.apk_path }}
          tag_name: ${{ github.ref_name }}
          name: AutoBrowser Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## AutoBrowser Release ${{ github.ref_name }}
            
            **Creator:** FourgeAI LABS ([https://github.com/fourgeailabs](https://github.com/fourgeailabs))
            
            ### Included Assets:
            - `AutoBrowser-v2.03.00.apk`
            
            ### Highlights (v2.03.00):
            - Chevrolet Equinox EV notification bar clearance & system top inset layout
            - In-Drive Testing Mode: continuous web browsing, dashboard monitoring & auto-scrolling
            - Dedicated top bar offset controls in Settings & In-Car Quick Bar (Auto, 48dp, 56dp, 64dp, 72dp, 80dp, 96dp)
            - distractionOptimized meta-data enabling uninterrupted Android Automotive OS road testing
            - Android Automotive OS (AAOS) standalone compatibility with automotive descriptors
            - In-Car Quick Presets bar for EV charging, radar, traffic, and radio
            - Intelligent auto-refresh engine with countdown timers
            - Hands-free auto-scroller with 10-level variable speed
            - Multi-URL rotation cycling and JavaScript automation console
            - Persistent Room bookmarks and browsing history
